<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showcase | Local Hazards Network</title>
  <meta name="description"
    content="Watch the Local Hazards Network pitch video and explore our ENGN4300 Capstone project on multi-hazard monitoring in rural NSW." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/layout.js"></script>
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <link rel="manifest" href="favicon/site.webmanifest" />

  <style>
    /* =============================================
       SHOWCASE PAGE
       ============================================= */
    .showcase {
      position: relative;
      overflow: hidden;
    }

    .showcase-inner {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }

    .showcase h1 {
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .showcase h1 span {
      color: var(--gold);
    }

    .showcase-desc {
      font-size: 1rem;
      color: var(--on-dark-muted);
      max-width: 620px;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    /* Responsive 16:9 video frame */
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--navy-deep);
      border: 1px solid var(--border-dark);
      box-shadow: var(--shadow-lg);
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--on-dark-faint);
    }

    .video-meta a {
      color: var(--on-dark-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .video-meta a:hover {
      color: #FFFFFF;
    }

    /* Landing page call to action */
    .showcase-cta {
      margin-top: 36px;
      padding: 24px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .showcase-cta h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .showcase-cta p {
      font-size: 0.9rem;
      color: var(--on-dark-muted);
      line-height: 1.55;
    }

    .showcase-cta .btn {
      font-size: 1rem;
      padding: 14px 28px;
    }

    @media (max-width: 600px) {
      .showcase-inner {
        padding: 32px 16px 48px;
      }

      .showcase-cta {
        padding: 20px;
      }

      .showcase-cta .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <site-header></site-header>

  <main class="showcase">
    <div class="showcase-inner">

      <h1>Local <span>Hazards Network</span></h1>
      <p class="showcase-desc">
        Low-power LoRa sensor node for multi-hazard monitoring
        in rural New South Wales. Watch our pitch, then explore the project.
      </p>

      <!-- Replace VIDEO_ID (in both places below) with the YouTube video ID,
           e.g. https://youtu.be/dQw4w9WgXcQ -> dQw4w9WgXcQ -->
      <div class="video-frame">
        <iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID?rel=0&modestbranding=1&playsinline=1"
          title="Local Hazards Network pitch video" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <div class="video-meta">
        <a href="https://www.youtube.com/watch?v=VIDEO_ID" target="_blank" rel="noopener">
          Watch on YouTube
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17L17 7" />
            <path d="M8 7h9v9" />
          </svg>
        </a>
      </div>

      <div class="showcase-cta">
        <div>
          <h2>Want the full story?</h2>
          <p>Visit our website to learn more about how this project came to be!</p>
        </div>
        <a href="index.html" class="btn btn-primary">
          Explore the Project
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </a>
      </div>

    </div>
  </main>

  <site-footer></site-footer>

</body>

</html>
